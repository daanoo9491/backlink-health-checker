name: Deploy

# development -> staging Worker, main -> production Worker.
on:
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Check the database IDs are filled in
        run: |
          if grep -q "PASTE-.*-DATABASE-ID-HERE" wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has a placeholder database_id. Create the D1 databases and paste their IDs (see README → Database setup)."
            exit 1
          fi

      - name: Apply database migrations (staging)
        if: github.ref_name != 'main'
        run: npx wrangler d1 migrations apply DB --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply database migrations (production)
        if: github.ref_name == 'main'
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build (staging)
        if: github.ref_name != 'main'
        run: npm run build
        env:
          CLOUDFLARE_ENV: staging
      - name: Build (production)
        if: github.ref_name == 'main'
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
