name: Deploy

# development -> the live Worker (backlink-health-checker-staging).
# There is no separate production Worker any more (retired in 0.14.0), so
# pushes to main run CI only and deploy nothing.
on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'development'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # The Supabase "Session pooler" connection string, stored as a GitHub secret.
      - name: Apply database migrations
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL_STAGING secret (README → Database setup)."; exit 1
          fi
          npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}

      - run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
