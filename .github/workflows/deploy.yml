name: Deploy

# development -> staging Worker, main -> production Worker.
on:
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Check the Hyperdrive IDs are filled in
        run: |
          if grep -q "PASTE-.*-HYPERDRIVE-ID-HERE" wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has a placeholder Hyperdrive id. Create the Hyperdrive configs and paste their ids (see README → Database setup)."
            exit 1
          fi

      # Supabase "Session pooler" connection strings, stored as GitHub secrets.
      - name: Apply database migrations (staging)
        if: github.ref_name != 'main'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL_STAGING secret (README → Database setup)."; exit 1
          fi
          npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}
      - name: Apply database migrations (production)
        if: github.ref_name == 'main'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL_PRODUCTION secret (README → Database setup)."; exit 1
          fi
          npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL_PRODUCTION }}

      - name: Build (staging)
        if: github.ref_name != 'main'
        run: npm run build
        env:
          CLOUDFLARE_ENV: staging
      - name: Build (production)
        if: github.ref_name == 'main'
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
